name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Resolve VSIX path
        id: vsix
        run: echo "path=$(ls kiro-worktrees-*.vsix | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        # Kiro (and other VS Code forks) pull extensions and updates from the
        # Open VSX Registry. Publishing here is what enables auto-update for
        # users who installed from the gallery. Skipped automatically if the
        # OVSX_PAT secret is not configured, so releases still succeed without it.
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish --packagePath "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"

      - name: Create GitHub Release and attach VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
